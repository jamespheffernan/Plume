name: BreatheClock
options:
  bundleIdPrefix: com.turfterrace.plume
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 7W38KL8969
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    SWIFT_VERSION: 5.0
targets:
  BreatheClock:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BreatheClock
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.turfterrace.plume.ios
        PRODUCT_NAME: Plume
        INFOPLIST_FILE: BreatheClock/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: SageAppIcon IndigoAppIcon PlumAppIcon OchreAppIcon SlateAppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  BreatheClock:
    build:
      targets:
        BreatheClock: all
    run:
      config: Debug
