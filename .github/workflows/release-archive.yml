name: Build release archive

on:
  push:
    branches:
      - codex/plume-release-recovery-20260826
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store build number
        required: true
        type: string

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set build number
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [[ -n "$REQUESTED_BUILD_NUMBER" ]]; then
            BUILD_NUMBER="$REQUESTED_BUILD_NUMBER"
          else
            BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER"

      - name: Select the accepted Xcode release
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          scripts/verify_release_toolchain.sh \
            --developer-dir /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build unsigned App Store archive
        run: |
          xcodebuild \
            -project BreatheClock.xcodeproj \
            -scheme BreatheClock \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Plume.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Verify archive toolchain metadata
        run: |
          scripts/verify_release_toolchain.sh --archive "$RUNNER_TEMP/Plume.xcarchive"
          APP="$RUNNER_TEMP/Plume.xcarchive/Products/Applications/Plume.app"
          /usr/libexec/PlistBuddy -c 'Print:CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print:CFBundleVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print:BuildMachineOSBuild' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print:DTXcodeBuild' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print:DTSDKBuild' "$APP/Info.plist"

      - name: Package archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Plume.xcarchive" \
            "$RUNNER_TEMP/Plume.xcarchive.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: plume-release-archive
          path: ${{ runner.temp }}/Plume.xcarchive.zip
          if-no-files-found: error
          retention-days: 7
